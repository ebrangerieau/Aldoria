name: v2

# Les Chroniques d'Aldoria v2 (dossier v2/) : API reprise de la v1, espace parent, client
# Babylon.js. Ne publie rien pour l'instant : la mise en ligne sur aldoria2.bandtrack.fr
# s'ajoute à la fin de la phase 0 (v2/IMPLEMENTATION_PLAN.md, étape 0.6).
on:
  push:
    branches: [main]
    paths: ['v2/**', '.github/workflows/v2.yml']
  pull_request:
    paths: ['v2/**', '.github/workflows/v2.yml']
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v2/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  client:
    # Types, tests unitaires (dont les vecteurs de réponses partagés avec l'API), build, puis
    # parcours dans Chromium (WebGL logiciel) sous la CSP de production.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: v2/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            v2/client/package-lock.json
            v2/client/e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Navigateur des tests
        run: |
          npm ci --prefix e2e --no-audit --no-fund
          node e2e/node_modules/playwright-core/cli.js install --with-deps chromium > /dev/null
      - name: Parcours dans le navigateur
        env:
          E2E_SLOW: '3'
          E2E_OUT: ${{ runner.temp }}/aldoria2-e2e
        run: |
          npm run preview > "$RUNNER_TEMP/preview.log" 2>&1 &
          npx --yes wait-on@8 -t 60000 http://127.0.0.1:4173/
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-e2e-captures
          path: ${{ runner.temp }}/aldoria2-e2e
          retention-days: 7
