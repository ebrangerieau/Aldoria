name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ebrangerieau/aldoria
  PROD_URL: https://aldoria.bandtrack.fr

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # une boucle infinie dans un générateur ne doit pas tourner 6 h
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  admin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build  # vérification des types + build Vite

  game-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Import des ressources
        run: godot --headless --path game --import
      - name: Tests GUT
        # Sans -d : en mode debug, une erreur de script fige Godot au lieu d'échouer.
        # tools/gut.sh échoue aussi si un fichier de test n'a pas tourné (GUT l'ignore sans échouer).
        run: bash tools/gut.sh

  export-web:
    runs-on: ubuntu-latest
    needs: game-tests
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Modèles d'export à l'emplacement attendu par Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Export web
        run: |
          # Version du jeu (Options, erreurs remontées) : le commit.
          sed -i "s/^const VERSION := \"dev\"/const VERSION := \"$(echo "$GITHUB_SHA" | cut -c1-7)\"/" game/core/build_info.gd
          grep -q "$(echo "$GITHUB_SHA" | cut -c1-7)" game/core/build_info.gd
          mkdir -p build/web
          godot --headless --path game --import
          godot --headless --path game --export-release "Web" ../build/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: build/web
          retention-days: 7

  e2e-web:
    # Parcours joueur, lecture à voix haute et espace parent dans un navigateur, sur un banc jetable
    # (tools/e2e_ci.sh) : rien n'est publié si un parcours échoue.
    runs-on: ubuntu-latest
    needs: export-web
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/e2e/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-export
          path: build/web
      - name: Post-traitement (comme pour l'image publiée)
        run: python3 tools/postprocess_web.py build/web | tail -1
      - name: Parcours dans le navigateur
        run: bash tools/e2e_ci.sh "$RUNNER_TEMP/aldoria-e2e"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-captures
          path: ${{ runner.temp }}/aldoria-e2e
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    needs: [api-tests, admin-build, export-web, e2e-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-export
          path: build/web
      - name: Post-traitement (CSP, gzip, poids)
        run: python3 tools/postprocess_web.py build/web | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Version publiée (vérifiée après la mise en ligne)
        run: echo "$GITHUB_SHA" > build/web/version.txt
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construction et publication des images
        run: |
          for svc in web api voice; do
            docker build -f deploy/${svc}.Dockerfile --build-arg GIT_SHA=${GITHUB_SHA} \
              -t ${IMAGE_PREFIX}-${svc}:${GITHUB_SHA} \
              -t ${IMAGE_PREFIX}-${svc}:latest .
            docker push --all-tags ${IMAGE_PREFIX}-${svc}
          done

  deploy:
    runs-on: ubuntu-latest
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historique complet : migrations ajoutées depuis la version en service
      - name: Déploiement sur le VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$VPS_HOST" ]; then
            echo "Secrets VPS absents : déploiement ignoré." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          install -m 600 /dev/null ~/key && printf '%s\n' "$SSH_KEY" > ~/key
          mkdir -p ~/.ssh
          # Le scan de clé échoue parfois (réseau) : 3 essais.
          for i in 1 2 3; do ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts && break; sleep 10; done
          ssh -i ~/key "$VPS_USER@$VPS_HOST" "mkdir -p /docker/aldoria/backup"
          # Sauvegarde de la base avant toute nouvelle migration (l'image API l'applique au démarrage) :
          # quand une migration a changé depuis le commit en service, ou si ce commit est inconnu.
          # Dump complet vérifié (sinon le déploiement s'arrête) ; les 10 plus récents sont gardés.
          live=$(curl -fsS "$PROD_URL/api/v1/health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' || true)
          if [ -z "$live" ] || ! git cat-file -e "${live}^{commit}" 2>/dev/null \
             || [ -n "$(git diff --name-only "$live" "$GITHUB_SHA" -- api/alembic/versions)" ]; then
            dump="avant-deploiement-$(echo "$GITHUB_SHA" | cut -c1-7)-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
            ssh -i ~/key "$VPS_USER@$VPS_HOST" "cd /docker/aldoria && mkdir -p backups \
              && docker compose exec -T db sh -c 'pg_dump -U \$POSTGRES_USER \$POSTGRES_DB' | gzip > backups/$dump \
              && chmod 600 backups/$dump \
              && gzip -dc backups/$dump | tail -c 300 | grep -q 'PostgreSQL database dump complete' \
              && (ls -1t backups/avant-deploiement-*.sql.gz | tail -n +11 | xargs -r rm --) \
              && ls -l backups/$dump"
            echo "Sauvegarde avant migration : backups/$dump (version en service : ${live:-inconnue})" >> "$GITHUB_STEP_SUMMARY"
          fi
          scp -i ~/key deploy/docker-compose.yml "$VPS_USER@$VPS_HOST:/docker/aldoria/docker-compose.yml"
          scp -i ~/key deploy/backup/*.sh "$VPS_USER@$VPS_HOST:/docker/aldoria/backup/"
          # Le service backup est relancé pour lire la nouvelle version de son script
          # (il rattrape la sauvegarde du jour si elle manque, sinon il attend la suivante).
          ssh -i ~/key "$VPS_USER@$VPS_HOST" \
            "cd /docker/aldoria && sed -i 's/^ALDORIA_TAG=.*/ALDORIA_TAG=${GITHUB_SHA}/' .env && docker compose pull && docker compose up -d --remove-orphans && docker compose restart backup"
      - name: Contrôle en production (nouvelle version en service)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          [ -z "$VPS_HOST" ] && exit 0  # pas de déploiement (secrets absents)
          # L'API (base joignable, migrations appliquées au démarrage) et le jeu doivent servir ce commit
          # dans les 5 minutes.
          for i in $(seq 1 30); do
            health=$(curl -fsS "$PROD_URL/api/v1/health" || true)
            web=$(curl -fsS "$PROD_URL/version.txt?n=$i" || true)
            if echo "$health" | grep -q "\"version\":\"$GITHUB_SHA\"" && echo "$health" | grep -q '"status":"ok"' \
               && [ "$web" = "$GITHUB_SHA" ]; then
              echo "En production : $health" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "La production ne sert pas ce commit : API $health ; jeu ${web:-?}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
