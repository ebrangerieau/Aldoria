name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ebrangerieau/aldoria

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  game-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Import des ressources
        run: godot --headless --path game --import
      - name: Tests GUT
        # Sans -d : en mode debug, une erreur de script fige Godot au lieu d'échouer.
        run: timeout 600 godot --headless --path game -s addons/gut/gut_cmdln.gd -gexit

  export-web:
    runs-on: ubuntu-latest
    needs: game-tests
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Modèles d'export à l'emplacement attendu par Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Export web
        run: |
          mkdir -p build/web
          godot --headless --path game --import
          godot --headless --path game --export-release "Web" ../build/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: build/web
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    needs: [api-tests, export-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-export
          path: build/web
      - name: Post-traitement (CSP, gzip, poids)
        run: python3 tools/postprocess_web.py build/web | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construction et publication des images
        run: |
          for svc in web api; do
            docker build -f deploy/${svc}.Dockerfile \
              -t ${IMAGE_PREFIX}-${svc}:${GITHUB_SHA} \
              -t ${IMAGE_PREFIX}-${svc}:latest .
            docker push --all-tags ${IMAGE_PREFIX}-${svc}
          done

  deploy:
    runs-on: ubuntu-latest
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Déploiement sur le VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$VPS_HOST" ]; then
            echo "Secrets VPS absents : déploiement ignoré." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          install -m 600 /dev/null ~/key && printf '%s\n' "$SSH_KEY" > ~/key
          mkdir -p ~/.ssh
          # Le scan de clé échoue parfois (réseau) : 3 essais.
          for i in 1 2 3; do ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts && break; sleep 10; done
          scp -i ~/key deploy/docker-compose.yml "$VPS_USER@$VPS_HOST:/docker/aldoria/docker-compose.yml"
          ssh -i ~/key "$VPS_USER@$VPS_HOST" \
            "cd /docker/aldoria && sed -i 's/^ALDORIA_TAG=.*/ALDORIA_TAG=${GITHUB_SHA}/' .env && docker compose pull && docker compose up -d --remove-orphans"
