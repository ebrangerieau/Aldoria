# Banc de test local : rôle de Traefik en production (même origine pour le jeu et l'API).
# Utilisé par tools/e2e_web.ps1.
server {
    listen 80 default_server;
    location /api/ {
        proxy_pass http://aldoria-api-test:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://aldoria-web-local:80;
        proxy_set_header Host $host;
    }
}

# Espace parent : TinyAuth simulé (identité fixe) et secret du routeur admin.
# Clé de test locale uniquement, sans valeur en production.
server {
    listen 80;
    server_name aldoria-admin.localhost;
    location /api/v1/admin/ {
        proxy_pass http://aldoria-api-test:8000;
        proxy_set_header Host $host;
        proxy_set_header Remote-User "parent";
        proxy_set_header Remote-Email "parent@test.local";
        proxy_set_header Remote-Name "Parent (banc de test)";
        proxy_set_header X-Aldoria-Admin-Key "cle-de-test-locale-uniquement-0123456789";
    }
    location / {
        proxy_pass http://aldoria-web-local:80;
        proxy_set_header Host $host;
    }
}
