# Fichiers du jeu (export web Godot) et de l'espace parent, selon l'hôte.
# TLS terminé par Traefik. Voir docs/TRD.md §8 (en-têtes) et §10.1 (MIME, compression, cache).

types {
    application/wasm wasm;
    application/octet-stream pck;
    application/manifest+json webmanifest;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Redirections relatives : nginx ne voit que du HTTP derrière Traefik.
    absolute_redirect off;

    # Fichiers .gz précompressés en CI (tools/postprocess_web.py).
    gzip_static on;
    gzip on;
    gzip_types application/javascript application/wasm application/octet-stream text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # Godot n'ajoute pas de hash aux noms de fichiers (index.wasm, index.pck) :
    # le navigateur revalide à chaque lancement (304 via ETag si rien n'a changé).
    add_header Cache-Control "no-cache" always;
    # Traefik termine TLS mais n'ajoute pas HSTS sur ce VPS (TRD §8).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Options de test saisies sans le « ? » sur la tablette (/perf&quality=bas) :
    # on rétablit l'URL attendue (/?perf&quality=bas) au lieu d'un 404.
    location ~ ^/((perf|quality|merge)[^/]*)$ {
        return 302 /?$1;
    }
}

# Espace parent (aldoria-admin.*) : Traefik ne laisse passer qu'après TinyAuth.
# Fichiers Vite nommés par hash : cache long ; index.html revalidé à chaque fois.
map $uri $admin_cache {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 80;
    server_name ~^aldoria-admin\.;
    root /usr/share/nginx/admin;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $admin_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location / {
        try_files $uri /index.html;
    }
}
