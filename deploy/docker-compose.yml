# Les Chroniques d'Aldoria – déploiement sur le VPS bandtrack.fr, derrière Traefik.
# Sur le VPS : /docker/aldoria/{docker-compose.yml,.env}
# Vérifier l'interpolation : docker compose config | grep "rule="

services:
  web:
    image: ghcr.io/ebrangerieau/aldoria-web:${ALDORIA_TAG:-latest}
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.priority=1"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"
      # Espace parent : même conteneur nginx (bloc server de l'hôte admin). Les adultes s'y
      # connectent avec leur compte Aldoria (api/app/accounts.py) ; plus de SSO devant.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin.rule=Host(`${COMPOSE_PROJECT_NAME}-admin.${TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin.priority=1"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin.service=${COMPOSE_PROJECT_NAME}"

  api:
    image: ghcr.io/ebrangerieau/aldoria-api:${ALDORIA_TAG:-latest}
    restart: unless-stopped
    environment:
      ALDORIA_ENVIRONMENT: prod
      ALDORIA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALDORIA_JWT_SECRET: ${ALDORIA_JWT_SECRET}
      ALDORIA_ADMIN_KEY: ${ALDORIA_ADMIN_KEY}
      # Adresse de l'espace parent, pour les liens d'invitation.
      ALDORIA_ADMIN_URL: https://${COMPOSE_PROJECT_NAME}-admin.${TRAEFIK_HOST}
      ALDORIA_BACKUP_STATUS_DIR: /etat-sauvegardes
    volumes:
      # État des sauvegardes seulement (pas les sauvegardes elles-mêmes), pour l'espace parent.
      - ./backups/etat:/etat-sauvegardes:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # API joueur : tout /api sauf l'API parent, qui ne sera servie que sur l'hôte admin
      # (IMPLEMENTATION_PLAN §1.3 et chantier « plusieurs familles »).
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.rule=Host(`${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}`) && PathPrefix(`/api`) && !PathPrefix(`/api/v1/admin`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.priority=10"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.middlewares=${COMPOSE_PROJECT_NAME}-strip-identity"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-api.loadbalancer.server.port=8000"
      # Connexion d'un enfant et liaison d'un appareil : débit limité (essais de codes).
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-play-auth.rule=Host(`${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}`) && (Path(`/api/v1/play/login`) || Path(`/api/v1/play/devices/pair`))"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-play-auth.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-play-auth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-play-auth.priority=15"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-play-auth.service=${COMPOSE_PROJECT_NAME}-api"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-play-auth.middlewares=${COMPOSE_PROJECT_NAME}-strip-identity,${COMPOSE_PROJECT_NAME}-auth-limit"
      # 20 essais par minute et par adresse IP (une famille entière partage la même).
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-auth-limit.ratelimit.average=20"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-auth-limit.ratelimit.period=1m"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-auth-limit.ratelimit.burst=10"
      # Un en-tête vide le supprime : empêche un client de se faire passer pour l'espace parent.
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-strip-identity.headers.customrequestheaders.Remote-User="
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-strip-identity.headers.customrequestheaders.Remote-Email="
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-strip-identity.headers.customrequestheaders.Remote-Name="
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-strip-identity.headers.customrequestheaders.Remote-Groups="
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-strip-identity.headers.customrequestheaders.X-Aldoria-Admin-Key="
      # API parent : seulement sur l'hôte admin, avec le secret que seul
      # ce routeur ajoute (l'API refuse toute requête parent sans lui).
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-api.rule=Host(`${COMPOSE_PROJECT_NAME}-admin.${TRAEFIK_HOST}`) && PathPrefix(`/api/v1/admin`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-api.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-api.priority=20"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-api.service=${COMPOSE_PROJECT_NAME}-api"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-api.middlewares=${COMPOSE_PROJECT_NAME}-admin-key"
      # Connexion d'un adulte et liens d'invitation : débit limité.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-login.rule=Host(`${COMPOSE_PROJECT_NAME}-admin.${TRAEFIK_HOST}`) && (Path(`/api/v1/admin/login`) || PathPrefix(`/api/v1/admin/invitations`))"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-login.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-login.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-login.priority=30"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-login.service=${COMPOSE_PROJECT_NAME}-api"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-login.middlewares=${COMPOSE_PROJECT_NAME}-admin-key,${COMPOSE_PROJECT_NAME}-auth-limit"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-admin-key.headers.customrequestheaders.X-Aldoria-Admin-Key=${ALDORIA_ADMIN_KEY}"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Réseau interne uniquement : jamais exposé à Traefik ni à l'extérieur.
    networks:
      - default

  # Sauvegarde quotidienne de la base (deploy/backup/sauvegarde.sh, copié par la CI à côté
  # de ce fichier) : /docker/aldoria/backups/quotidiennes, 14 copies ; état lu par l'API.
  # La copie à la maison passe par deploy/backup/copie-maison.sh (clé SSH restreinte).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["sh", "/sauvegarde.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      SAUVEGARDE_HEURE: ${SAUVEGARDE_HEURE:-3}
      SAUVEGARDE_NOMBRE: ${SAUVEGARDE_NOMBRE:-14}
    volumes:
      - ./backup/sauvegarde.sh:/sauvegarde.sh:ro
      - ./backups/quotidiennes:/sauvegardes
      - ./backups/etat:/etat
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

volumes:
  db-data:

networks:
  web:
    external: true
