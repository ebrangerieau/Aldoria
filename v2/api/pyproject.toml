[project]
name = "aldoria-api"
version = "0.1.0"
description = "API des Chroniques d'Aldoria : moteur pédagogique, sessions et sauvegardes."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "ziamath>=0.13",
    "alembic>=1.20.0",
    "pyjwt>=2.15.1",
    "argon2-cffi>=25.1.0",
    "anthropic>=1.13.0",
    "httpx>=0.28",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "aiosqlite>=0.22.1",
    "sympy>=1.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Énoncés, indices et explications en français : on ne coupe pas les phrases.
"app/engine/generators/*.py" = ["E501"]
