# Jeu v2 (build Vite du client Babylon.js) et espace parent (React), selon l'hôte.
# TLS terminé par Traefik. En-têtes : v2/docs/TRD.md §7 ; la même CSP est posée par
# `vite preview` (client/vite.config.ts) pour que les tests dans le navigateur la vérifient.

types {
    application/javascript js mjs;
    text/css css;
    text/html html;
    application/json json;
    model/gltf-binary glb;
    model/gltf+json gltf;
    application/octet-stream bin;
    image/png png;
    image/svg+xml svg;
    font/woff2 woff2;
    font/woff woff;
    font/ttf ttf;
    audio/mpeg mp3;
    audio/wav wav;
}

# Fichiers produits par Vite (nommés par empreinte) : cache long. Le reste (index.html, modèles
# 3D, polices et sons de /ressources/) : revalidé à chaque chargement (304 si rien n'a changé).
map $uri $game_cache {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml model/gltf+json application/octet-stream model/gltf-binary;
    gzip_min_length 1024;

    add_header Cache-Control $game_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # Fichiers produits par Vite : un fichier absent (onglet ouvert avant une mise en ligne) est une 404,
    # jamais la page d'accueil, que le navigateur refuserait comme module (client/src/app/staleBuild.ts).
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Espace parent (<projet>-admin.*, code de v2/admin) : mêmes règles que dans la v1.
map $uri $admin_cache {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 80;
    server_name ~-admin\.;
    root /usr/share/nginx/admin;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $admin_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
