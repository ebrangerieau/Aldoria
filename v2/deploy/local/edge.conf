# Banc de test de l'espace parent (v2/tools/e2e_admin.sh) : rôle de Traefik en production
# (deploy/docker-compose.yml à la racine). Valeurs de test uniquement.

# Hôte public (jeu) : /api va à l'API, sans le secret du routeur admin ; le reste au nginx de web2.
server {
    listen 80 default_server;
    location /api/ {
        proxy_pass http://aldoria2-e2e-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://aldoria2-e2e-web:80;
        proxy_set_header Host $host;
    }
}

# Espace parent : seule l'API parent passe, avec le secret que seul ce routeur ajoute ; le reste est
# servi par le nginx de web2 (bloc server de l'hôte admin, build de v2/admin).
server {
    listen 80;
    server_name aldoria-admin.localhost;
    location /api/v1/admin/ {
        proxy_pass http://aldoria2-e2e-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Aldoria-Admin-Key "cle-de-test-locale-uniquement-0123456789";
    }
    location / {
        proxy_pass http://aldoria2-e2e-web:80;
        proxy_set_header Host $host;
    }
}
